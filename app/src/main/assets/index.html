<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pragya Production</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b1120; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    input, select { background-color: #0f172a !important; color: #f8fafc !important; }
  </style>
</head>
<body class="p-3 pb-28">

  <!-- Header -->
  <header class="bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-3 shadow-lg">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-xl font-black text-emerald-400 tracking-wider">PRAGYA PRODUCTION</h1>
        <p class="text-[11px] text-slate-400 font-medium">Made by <span class="text-emerald-300 font-bold">Harshit</span></p>
      </div>
      <div class="flex items-center gap-1.5">
        <button onclick="shareWhatsAppReport()" class="bg-green-600 active:bg-green-700 px-3 py-1.5 rounded-xl text-xs font-bold text-white flex items-center gap-1 shadow">
          📲 Share
        </button>
        <button onclick="saveCurrentDay()" class="bg-emerald-600 active:bg-emerald-700 px-3 py-1.5 rounded-xl text-xs font-bold text-white shadow">
          💾 Save
        </button>
      </div>
    </div>

    <!-- Date & Auto Carry -->
    <div class="grid grid-cols-2 gap-2 mt-3 pt-3 border-t border-slate-800">
      <div>
        <label class="text-[10px] text-slate-400 block mb-0.5">Production Date</label>
        <input type="date" id="prodDate" class="w-full border border-slate-700 rounded-xl px-2.5 py-1.5 text-xs outline-none" onchange="onDateChanged()">
      </div>
      <div>
        <label class="text-[10px] text-slate-400 block mb-0.5">Auto Carry-Forward</label>
        <div class="flex items-center justify-between bg-slate-950 px-3 py-1.5 rounded-xl border border-slate-800">
          <span class="text-[11px] text-slate-400" id="carryLabel">ON</span>
          <input type="checkbox" id="autoCarryToggle" checked onchange="toggleCarry()" class="w-4 h-4 accent-emerald-500">
        </div>
      </div>
    </div>

    <!-- Plant Selector -->
    <div class="grid grid-cols-2 gap-2 mt-2.5">
      <button id="btnMogar" onclick="switchPlant('MOGAR')" class="py-2 rounded-xl text-xs font-black uppercase bg-emerald-600 text-white transition">
        Moong Mogar
      </button>
      <button id="btnDal" onclick="switchPlant('DAL')" class="py-2 rounded-xl text-xs font-black uppercase bg-slate-800 text-slate-400 transition">
        Moong Dal
      </button>
    </div>
  </header>

  <!-- Live KPI Bar -->
  <div class="grid grid-cols-3 gap-2 mb-3">
    <div class="bg-slate-900 border border-slate-800 p-2.5 rounded-2xl text-center">
      <div class="text-[9px] text-slate-400 uppercase font-bold">Total Intake</div>
      <div id="dispIntake" class="text-base font-black text-white mt-0.5">0 B</div>
      <div id="dispIntakeQtl" class="text-[10px] text-emerald-400 font-semibold">0.0 Qtl</div>
    </div>
    <div class="bg-slate-900 border border-slate-800 p-2.5 rounded-2xl text-center">
      <div class="text-[9px] text-slate-400 uppercase font-bold">Dispatched</div>
      <div id="dispDispatch" class="text-base font-black text-emerald-400 mt-0.5">0 B</div>
      <div id="dispDispatchQtl" class="text-[10px] text-slate-300 font-semibold">0.0 Qtl</div>
    </div>
    <div class="bg-slate-900 border border-slate-800 p-2.5 rounded-2xl text-center">
      <div class="text-[9px] text-slate-400 uppercase font-bold">Recovery %</div>
      <div id="dispRecovery" class="text-base font-black text-blue-400 mt-0.5">0%</div>
      <div class="text-[10px] text-slate-400 font-semibold">Yield Rate</div>
    </div>
  </div>

  <!-- Stage 1: Intake Hodi -->
  <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-3">
    <div class="flex justify-between items-center mb-2">
      <h2 class="text-xs font-bold text-white uppercase tracking-wider">Stage 1: Hodi (Intake 1000 Bags)</h2>
      <span class="text-[10px] px-2 py-0.5 rounded bg-emerald-950 text-emerald-300 border border-emerald-800">Moong</span>
    </div>
    <div class="grid grid-cols-2 gap-2">
      <div>
        <label class="text-[10px] text-slate-400">Day Start (Bags)</label>
        <input type="number" id="hodiInitial" value="1000" class="w-full border border-slate-700 rounded-xl px-2.5 py-1.5 text-sm font-bold mt-1" oninput="calcTotals()">
      </div>
      <div>
        <label class="text-[10px] text-slate-400">+ Add Running</label>
        <div class="flex gap-1 mt-1">
          <input type="number" id="hodiAdd" placeholder="100" class="w-full border border-slate-700 rounded-xl px-2.5 py-1.5 text-sm">
          <button onclick="addIntakeAddon()" class="bg-emerald-600 px-3 rounded-xl font-bold text-xs text-white">+</button>
        </div>
      </div>
    </div>
    <div id="addonTags" class="flex flex-wrap gap-1 mt-2"></div>
  </section>

  <!-- Dynamic Hoppers Container -->
  <div id="hoppersContainer" class="space-y-3 mb-3"></div>

  <!-- Truck Dispatch -->
  <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-3">
    <h2 class="text-xs font-bold text-white mb-2 uppercase tracking-wider">🚚 Truck Dispatch Logger</h2>
    <div class="space-y-2">
      <div class="grid grid-cols-2 gap-2">
        <input type="text" id="truckNo" placeholder="Truck No (RJ-21)" class="border border-slate-700 rounded-xl p-2 text-xs uppercase">
        <input type="text" id="truckGrade" placeholder="Count / Grade" class="border border-slate-700 rounded-xl p-2 text-xs">
      </div>
      <div class="grid grid-cols-3 gap-2">
        <select id="truckHopper" class="border border-slate-700 rounded-xl p-2 text-xs"></select>
        <input type="number" id="truckBags" placeholder="Bags" class="border border-slate-700 rounded-xl p-2 text-xs">
        <input type="number" id="truckKg" placeholder="Kg (50)" value="50" class="border border-slate-700 rounded-xl p-2 text-xs">
      </div>
      <button onclick="addDispatch()" class="w-full bg-emerald-600 active:bg-emerald-700 py-2.5 rounded-xl text-xs font-bold text-white">
        + Log Truck Dispatch
      </button>
    </div>
    <div id="dispatchList" class="mt-3 space-y-1"></div>
  </section>

  <!-- By Products -->
  <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-3">
    <h2 class="text-xs font-bold text-white mb-2 uppercase tracking-wider">Direct Floor By-Products & Off-Grade</h2>
    <div id="byProductsList" class="space-y-2"></div>
  </section>

  <!-- History & Edit/Delete Panel -->
  <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-3">
    <div class="flex items-center justify-between mb-2">
      <h2 class="text-xs font-bold text-white uppercase tracking-wider">📁 Saved Day Records & History</h2>
      <button onclick="renderHistoryList()" class="text-[10px] text-emerald-400 underline">Refresh</button>
    </div>
    <div id="historyList" class="space-y-1.5 max-h-48 overflow-y-auto pr-1"></div>
  </section>

  <script>
    const CONFIG = {
      MOGAR: [
        { name: "Sizing Hoppers (300 Bags)", hoppers: [
          { id: "sz1", name: "Sizing #1", cap: 300, def: 300, mat: "Chota Moong" },
          { id: "sz2", name: "Sizing #2", cap: 300, def: 300, mat: "Bada Moong" },
          { id: "sz3", name: "Sizing #3", cap: 300, def: 300, mat: "Kachri" },
          { id: "sz4", name: "Sizing #4", cap: 300, def: 300, mat: "Moong" },
        ]},
        { name: "Gravity & Oiling (300 Bags)", hoppers: [
          { id: "grav", name: "Gravity Hopper", cap: 80, def: 80, mat: "Moong" },
          { id: "oil1", name: "Oiling #1", cap: 300, def: 300, mat: "Moong" },
          { id: "oil2", name: "Oiling #2", cap: 300, def: 300, mat: "Moong" },
          { id: "oil3", name: "Oiling #3", cap: 300, def: 300, mat: "Moong" },
          { id: "oil4", name: "Oiling #4", cap: 300, def: 300, mat: "Moong" },
        ]},
        { name: "Conditioning & Chhanti", hoppers: [
          { id: "tr1", name: "Garam Trolley #1", cap: 60, def: 60, mat: "Moong" },
          { id: "tr2", name: "Garam Trolley #2", cap: 60, def: 60, mat: "Moong" },
          { id: "grm", name: "Garam Hopper", cap: 300, def: 300, mat: "Moong" },
          { id: "ch1", name: "Chhanti #1", cap: 300, def: 300, mat: "Moong" },
          { id: "ch2", name: "Chhanti #2", cap: 300, def: 300, mat: "Moong" },
          { id: "gl1", name: "Goliya #1", cap: 150, def: 150, mat: "Moong" },
          { id: "gl2", name: "Goliya #2", cap: 150, def: 150, mat: "Moong" },
        ]},
        { name: "Non-Sortex Fatka Hoppers", hoppers: [
          { id: "ns1", name: "Non-Sortex #1", cap: 400, def: "", mat: "Semi" },
          { id: "ns2", name: "Non-Sortex #2", cap: 400, def: "", mat: "Bold" },
          { id: "ns3", name: "Non-Sortex #3", cap: 300, def: "", mat: "Mogar" },
          { id: "ns4", name: "Non-Sortex #4", cap: 250, def: "", mat: "Tukri" },
        ]},
        { name: "Sortex Finished Goods (Truck Loading)", isDispatch: true, hoppers: [
          { id: "stx1", name: "Sortex #1", cap: 350, def: "", mat: "Semi" },
          { id: "stx2", name: "Sortex #2", cap: 350, def: "", mat: "Small" },
          { id: "stx3", name: "Sortex #3", cap: 350, def: "", mat: "Bold" },
          { id: "stx4", name: "Sortex #4", cap: 350, def: "", mat: "" },
          { id: "stx5", name: "Sortex #5", cap: 350, def: "", mat: "" },
          { id: "stx6", name: "Sortex #6", cap: 300, def: "", mat: "" },
        ]},
        { name: "Chilka Storage", hoppers: [
          { id: "chilk", name: "Chilka Hopper", cap: 80, def: 80, mat: "Chilka" }
        ]}
      ],
      DAL: [
        { name: "Sizing & Storage (300 Bags)", hoppers: [
          { id: "dsz1", name: "Sizing #1", cap: 300, def: 300, mat: "Chota Moong" },
          { id: "dsz2", name: "Sizing #2", cap: 300, def: 300, mat: "Mota Moong" },
          { id: "dst1", name: "Pre-Roll #1", cap: 300, def: 300, mat: "Chota Moong" },
          { id: "dst2", name: "Pre-Roll #2", cap: 300, def: 300, mat: "Bada Moong" },
        ]},
        { name: "Rubber, Polisher & Paani", hoppers: [
          { id: "drb1", name: "Rubber #1", cap: 300, def: 300, mat: "Moong" },
          { id: "drb2", name: "Rubber #2", cap: 300, def: 300, mat: "Daal" },
          { id: "dpn", name: "Paani Hopper", cap: 300, def: 300, mat: "Moong" },
          { id: "dpl1", name: "Polisher #1", cap: 300, def: 300, mat: "Moong" },
          { id: "dpl2", name: "Polisher #2", cap: 300, def: 300, mat: "Moong" },
        ]},
        { name: "Chakki Hoppers (Dispatch)", isDispatch: true, hoppers: [
          { id: "dck1", name: "Chakki #1", cap: 300, def: 300, mat: "Chilka Daal" },
          { id: "dck2", name: "Chakki #2", cap: 300, def: 300, mat: "Chilka Daal" },
          { id: "dck3", name: "Chakki #3", cap: 300, def: 300, mat: "Khanda" },
          { id: "dck4", name: "Chakki #4", cap: 300, def: 300, mat: "Korma" },
        ]},
        { name: "Waste & Dedicated Storage", hoppers: [
          { id: "dpwd", name: "Powder Hopper", cap: 300, def: 300, mat: "Powder" },
          { id: "dudn", name: "Udaan Chilka", cap: 150, def: 150, mat: "Udaan Chilka" },
        ]}
      ]
    };

    const BY_PRODS = {
      MOGAR: ["Tukri", "Churi", "Direct Chilka", "Direct Mogar", "Sortex Rejection"],
      DAL: ["Churi", "Kachri", "Jhadan"]
    };

    let curPlant = "MOGAR";
    let addOns = [];
    let dispatches = [];

    document.getElementById("prodDate").value = new Date().toISOString().split("T")[0];

    function toggleCarry() {
      const isChecked = document.getElementById("autoCarryToggle").checked;
      document.getElementById("carryLabel").innerText = isChecked ? "ON" : "OFF";
    }

    function switchPlant(plant) {
      curPlant = plant;
      document.getElementById("btnMogar").className = plant === 'MOGAR' ? 'py-2 rounded-xl text-xs font-black uppercase bg-emerald-600 text-white transition' : 'py-2 rounded-xl text-xs font-black uppercase bg-slate-800 text-slate-400 transition';
      document.getElementById("btnDal").className = plant === 'DAL' ? 'py-2 rounded-xl text-xs font-black uppercase bg-amber-600 text-white transition' : 'py-2 rounded-xl text-xs font-black uppercase bg-slate-800 text-slate-400 transition';
      renderHoppers();
      renderByProducts();
      updateTruckHopperOptions();
      loadDayData();
    }

    function renderHoppers() {
      const cont = document.getElementById("hoppersContainer");
      cont.innerHTML = "";
      CONFIG[curPlant].forEach(sec => {
        let htm = `<section class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
          <h3 class="text-xs font-bold uppercase text-slate-400 mb-2.5 tracking-wider">${sec.name}</h3>
          <div class="grid grid-cols-2 gap-2">`;
        sec.hoppers.forEach(h => {
          htm += `<div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800">
            <div class="flex justify-between items-center text-[10px] text-slate-400 mb-1">
              <span class="font-bold text-white">${h.name}</span>
              <span class="text-[9px] bg-slate-900 px-1 py-0.5 rounded border border-slate-800">${h.cap} B</span>
            </div>
            <input type="number" id="h_${h.id}" value="${h.def}" placeholder="Bags" class="w-full border border-slate-700 rounded-lg p-1 text-xs text-right font-bold" oninput="calcTotals()">
            <input type="text" id="m_${h.id}" value="${h.mat}" placeholder="Count/Grade" class="w-full border border-slate-800 rounded-lg p-1 text-[11px] mt-1 text-slate-300">
          </div>`;
        });
        htm += `</div></section>`;
        cont.innerHTML += htm;
      });
    }

    function renderByProducts() {
      const cont = document.getElementById("byProductsList");
      cont.innerHTML = "";
      BY_PRODS[curPlant].forEach((bp) => {
        cont.innerHTML += `<div class="flex justify-between items-center bg-slate-950 p-2 rounded-xl border border-slate-800">
          <span class="text-xs font-bold text-slate-300">${bp}</span>
          <div class="flex items-center gap-1">
            <input type="number" id="bp_${bp}" placeholder="Bags" class="w-16 border border-slate-700 rounded-lg p-1 text-xs text-right" oninput="calcTotals()">
            <span class="text-[10px] text-slate-500">x 50kg</span>
          </div>
        </div>`;
      });
    }

    function updateTruckHopperOptions() {
      const sel = document.getElementById("truckHopper");
      sel.innerHTML = `<option value="">Select Hopper</option>`;
      CONFIG[curPlant].forEach(sec => {
        if(sec.isDispatch) {
          sec.hoppers.forEach(h => {
            sel.innerHTML += `<option value="${h.id}">${h.name}</option>`;
          });
        }
      });
    }

    function addIntakeAddon() {
      const val = parseInt(document.getElementById("hodiAdd").value);
      if(!val) return;
      addOns.push(val);
      document.getElementById("hodiAdd").value = "";
      renderAddons();
      calcTotals();
    }

    function renderAddons() {
      const el = document.getElementById("addonTags");
      el.innerHTML = addOns.map((a, i) => `<span class="bg-emerald-950 text-emerald-400 border border-emerald-800 text-[10px] px-2 py-0.5 rounded-lg flex items-center gap-1">+${a} Bags <button onclick="removeAddon(${i})" class="text-red-400 font-bold ml-1">×</button></span>`).join("");
    }

    function removeAddon(i) {
      addOns.splice(i, 1);
      renderAddons();
      calcTotals();
    }

    function addDispatch() {
      const truck = document.getElementById("truckNo").value;
      const hop = document.getElementById("truckHopper").value;
      const bags = parseInt(document.getElementById("truckBags").value);
      const kg = parseFloat(document.getElementById("truckKg").value) || 50;
      const grade = document.getElementById("truckGrade").value;

      if(!truck || !hop || !bags) { alert("Kripya Truck No, Hopper aur Bags daalein!"); return; }

      const qtl = (bags * kg / 100).toFixed(1);
      dispatches.push({ truck, hop, bags, kg, grade, qtl });

      const inputEl = document.getElementById("h_" + hop);
      if(inputEl) {
        inputEl.value = Math.max(0, (parseInt(inputEl.value) || 0) - bags);
      }

      document.getElementById("truckNo").value = "";
      document.getElementById("truckBags").value = "";
      document.getElementById("truckGrade").value = "";
      renderDispatches();
      calcTotals();
    }

    function renderDispatches() {
      const el = document.getElementById("dispatchList");
      el.innerHTML = dispatches.map((d, i) => `<div class="bg-slate-950 p-2 rounded-xl text-[11px] flex justify-between items-center border border-slate-800">
        <div>
          <span class="font-bold text-white">${d.truck}</span>
          <span class="text-slate-400 ml-1">(${d.grade || 'Mogar'})</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-emerald-400 font-bold">${d.bags} Bags (${d.qtl} Qtl)</span>
          <button onclick="removeDispatch(${i})" class="text-red-400 font-bold text-xs">×</button>
        </div>
      </div>`).join("");
    }

    function removeDispatch(i) {
      dispatches.splice(i, 1);
      renderDispatches();
      calcTotals();
    }

    function calcTotals() {
      const initHodi = parseInt(document.getElementById("hodiInitial").value) || 0;
      const totalAdd = addOns.reduce((a, b) => a + b, 0);
      const totalIntakeBags = initHodi + totalAdd;
      const totalIntakeQtl = (totalIntakeBags * 0.5);

      document.getElementById("dispIntake").innerText = totalIntakeBags + " B";
      document.getElementById("dispIntakeQtl").innerText = totalIntakeQtl.toFixed(1) + " Qtl";

      const totalDispBags = dispatches.reduce((a, b) => a + b.bags, 0);
      const totalDispQtl = dispatches.reduce((a, b) => a + parseFloat(b.qtl), 0);
      document.getElementById("dispDispatch").innerText = totalDispBags + " B";
      document.getElementById("dispDispatchQtl").innerText = totalDispQtl.toFixed(1) + " Qtl";

      const rec = totalIntakeQtl > 0 ? ((totalDispQtl / totalIntakeQtl) * 100).toFixed(1) : 0;
      document.getElementById("dispRecovery").innerText = rec + "%";
    }

    function getKey(date, plant) {
      return `pragya_${plant}_${date}`;
    }

    function saveCurrentDay() {
      const dt = document.getElementById("prodDate").value;
      const key = getKey(dt, curPlant);

      const hoppers = {};
      CONFIG[curPlant].forEach(sec => {
        sec.hoppers.forEach(h => {
          const bEl = document.getElementById("h_" + h.id);
          const mEl = document.getElementById("m_" + h.id);
          hoppers[h.id] = {
            bags: bEl ? bEl.value : "",
            mat: mEl ? mEl.value : ""
          };
        });
      });

      const byProds = {};
      BY_PRODS[curPlant].forEach(bp => {
        const el = document.getElementById("bp_" + bp);
        byProds[bp] = el ? el.value : "";
      });

      const payload = {
        date: dt,
        plant: curPlant,
        initialHodi: document.getElementById("hodiInitial").value,
        addOns,
        dispatches,
        hoppers,
        byProds,
        updatedAt: new Date().toLocaleTimeString()
      };

      localStorage.setItem(key, JSON.stringify(payload));
      alert(`✅ Record saved for ${curPlant} (${dt})`);
      renderHistoryList();
    }

    function loadDayData() {
      const dt = document.getElementById("prodDate").value;
      const key = getKey(dt, curPlant);
      const saved = localStorage.getItem(key);

      if (saved) {
        const d = JSON.parse(saved);
        document.getElementById("hodiInitial").value = d.initialHodi || 1000;
        addOns = d.addOns || [];
        dispatches = d.dispatches || [];

        if (d.hoppers) {
          Object.keys(d.hoppers).forEach(id => {
            const bEl = document.getElementById("h_" + id);
            const mEl = document.getElementById("m_" + id);
            if (bEl) bEl.value = d.hoppers[id].bags;
            if (mEl) mEl.value = d.hoppers[id].mat;
          });
        }

        if (d.byProds) {
          Object.keys(d.byProds).forEach(bp => {
            const el = document.getElementById("bp_" + bp);
            if (el) el.value = d.byProds[bp];
          });
        }
      } else {
        addOns = [];
        dispatches = [];
        document.getElementById("hodiInitial").value = 1000;
        renderHoppers();
        renderByProducts();
      }

      renderAddons();
      renderDispatches();
      calcTotals();
      renderHistoryList();
    }

    function onDateChanged() {
      loadDayData();
    }

    function deleteRecord(key) {
      if (confirm("Are you sure you want to delete this record?")) {
        localStorage.removeItem(key);
        loadDayData();
      }
    }

    function editRecord(date, plant) {
      document.getElementById("prodDate").value = date;
      if (curPlant !== plant) {
        switchPlant(plant);
      } else {
        loadDayData();
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderHistoryList() {
      const el = document.getElementById("historyList");
      el.innerHTML = "";
      const keys = Object.keys(localStorage).filter(k => k.startsWith("pragya_"));

      if (keys.length === 0) {
        el.innerHTML = `<div class="text-[11px] text-slate-500 italic">No saved reports yet.</div>`;
        return;
      }

      keys.sort().reverse().forEach(k => {
        const raw = localStorage.getItem(k);
        if(!raw) return;
        const d = JSON.parse(raw);
        el.innerHTML += `
          <div class="flex items-center justify-between bg-slate-950 p-2 rounded-xl border border-slate-800 text-xs">
            <div>
              <span class="font-bold text-white">${d.date}</span>
              <span class="text-[10px] ml-1.5 px-1.5 py-0.5 rounded ${d.plant === 'MOGAR' ? 'bg-emerald-950 text-emerald-400' : 'bg-amber-950 text-amber-400'}">${d.plant}</span>
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="editRecord('${d.date}', '${d.plant}')" class="bg-blue-600/30 text-blue-300 px-2 py-0.5 rounded text-[11px] font-bold">Edit</button>
              <button onclick="deleteRecord('${k}')" class="bg-red-600/30 text-red-300 px-2 py-0.5 rounded text-[11px] font-bold">Del</button>
            </div>
          </div>
        `;
      });
    }

    function shareWhatsAppReport() {
      const dt = document.getElementById("prodDate").value;
      const intake = document.getElementById("dispIntake").innerText;
      const intakeQ = document.getElementById("dispIntakeQtl").innerText;
      const disp = document.getElementById("dispDispatch").innerText;
      const dispQ = document.getElementById("dispDispatchQtl").innerText;
      const rec = document.getElementById("dispRecovery").innerText;

      let msg = `*PRAGYA PRODUCTS - PRODUCTION REPORT*\n`;
      msg += `👤 Made by: Harshit\n`;
      msg += `📅 Date: ${dt}\n`;
      msg += `🏭 Plant: ${curPlant === 'MOGAR' ? 'Moong Mogar Plant' : 'Moong Dal Plant'}\n`;
      msg += `-----------------------------\n`;
      msg += `📥 *Total Raw Intake:* ${intake} (${intakeQ})\n`;
      msg += `📤 *Total Dispatched:* ${disp} (${dispQ})\n`;
      msg += `📈 *Recovery Rate:* ${rec}\n`;
      msg += `-----------------------------\n`;

      if (dispatches.length > 0) {
        msg += `🚚 *Truck Dispatches:*\n`;
        dispatches.forEach(d => {
          msg += `• ${d.truck}: ${d.bags} Bags (${d.qtl} Qtl) - ${d.grade || 'Mogar'}\n`;
        });
        msg += `-----------------------------\n`;
      }

      msg += `_Pragya Production App_`;

      const url = `https://wa.me/?text=${encodeURIComponent(msg)}`;
      window.open(url, "_blank");
    }

    switchPlant("MOGAR");
  </script>
